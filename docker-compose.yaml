name: skripsi

# No service declares `container_name`. Docker container names are global, so a
# fixed name means only one copy of this stack can exist on a host — a second
# checkout, or a colleague running it alongside their own, fails with
# "container name is already in use" before anything starts. Compose instead
# derives unique names per project (skripsi-postgres-1, ...). Address services
# by their compose name rather than a container name:
#   docker compose exec postgres psql -U postgres
#   docker compose logs -f reranker
services:
  # --- Application ---
  # The FastAPI app: API, admin UI, ingestion worker, guardrails.
  #
  #   docker compose build app && docker compose up -d app   ->  http://localhost:8000
  #
  # `.env` is written for running the app on the host, where every dependency is
  # at 127.0.0.1. Inside a container 127.0.0.1 is the container itself, so the
  # host-facing addresses are overridden here with compose service names. The
  # `environment:` block wins over `env_file:`, so the same .env serves both ways
  # of running and neither needs editing.
  app:
    profiles: ["app"]
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      # Container-internal ports, not the published host ones: TEI listens on 80,
      # the NLI and prompt-guard servers on 7997.
      RERANKER_BASE_URL: http://reranker:80
      CHAT_NLI_BASE_URL: http://nli:7997
      PROMPT_GUARD_BASE_URL: http://prompt-guard-ft:7997
      UNSTRUCTURED_BASE_URL: http://unstructured-api:8000
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      # Source PDFs and extracted images: real data, must outlive the container.
      - ./uploads:/app/uploads
      # Locally trained checkpoints (mmBERT NLI, prompt guard), read-only.
      - ./models:/models:ro
      # ~2.3 GB of BGE-M3 weights — a named volume so a rebuild does not
      # re-download them.
      - hf_cache:/cache/huggingface
    depends_on:
      - postgres
      - qdrant
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/admin/pdfs"]
      interval: 30s
      timeout: 10s
      # Generous: the first start loads BGE-M3 onto the GPU before serving.
      start_period: 180s
      retries: 3
    # GPU passthrough for in-process BGE-M3 embeddings. Delete this block (and
    # set BGE_M3_DEVICE=cpu) to run without a GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # --- Databases ---
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage


  # --- Inference & third-party services ---
  # RETIRED. Nothing selects it by default any more: the reranker moved to the
  # `reranker` (TEI) service and NLI to `nli-indoroberta`, both verified
  # equivalent on real data. Kept behind a profile rather than deleted so the
  # old backends stay A/B-able:
  #   COMPOSE_PROFILES=guard-base,legacy docker compose up -d infinity
  # then RERANKER_BACKEND=infinity or CHAT_NLI_BASE_URL=...:7997
  infinity:
    profiles: ["legacy"]
    image: michaelf34/infinity:0.0.77
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INFINITY_PORT:-7997}:7997"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      INFINITY_BATCH_SIZE: "2"
      INFINITY_MODEL_WARMUP: "false"
      HF_TOKEN: ${INFINITY_HF_API_KEY}
    command: >
      v2
      --model-id ${INFINITY_NLI_MODEL}
      --device cuda
      --dtype float16
    volumes:
      - infinity_cache:/app/.cache

  # Cross-encoder reranker on HuggingFace Text Embeddings Inference.
  #
  # Replaces Infinity for this model. TEI does real continuous batching (the one
  # thing Infinity was good at), is maintained by HF rather than being alpha, and
  # is not pinned to an old transformers — Infinity 0.0.77 ships transformers
  # 4.49, which is why it rejects any Qwen3 architecture (michaelfeil/infinity#611).
  #
  # `86-1.9` is the Ampere 8.6 build, matching the RTX 3070 Ti. On other hardware
  # pick the image from
  # https://huggingface.co/docs/text-embeddings-inference/supported_models
  #
  # Weights persist in the `tei_cache` volume, so the ~2.3 GB model downloads once.
  #
  # --max-client-batch-size must exceed the number of candidates SearchService
  # sends in one /rerank call (INITIAL_SEARCH_TOP_K = 50, see
  # app/kb/application/search_service.py). TEI's default is 32, which would
  # reject those requests outright.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.9
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RERANKER_PORT:-7996}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      HF_TOKEN: ${INFINITY_HF_API_KEY}
    command: >
      --model-id ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      --max-client-batch-size ${RERANKER_MAX_CLIENT_BATCH:-64}
      --max-concurrent-requests ${RERANKER_MAX_CONCURRENT:-64}
    volumes:
      - tei_cache:/data
    # No healthcheck: the TEI image carries no shell or curl, so every probe
    # form available to compose fails and the container reports "unhealthy"
    # while serving traffic perfectly well — worse than no signal at all.
    # Check it from the host instead: curl 127.0.0.1:${RERANKER_PORT:-7996}/health

  # ---------------------------------------------------------------------------
  # The IVM safety classifier ships as two interchangeable builds of the SAME
  # service: the stock Llama-Prompt-Guard-2 and the Indonesian fine-tune.
  # Exactly one runs at a time, selected by profile:
  #
  #   guard-base  -> prompt-guard     (stock, the default)
  #   guard-ft    -> prompt-guard-ft  (Indonesian fine-tune)
  #
  # `COMPOSE_PROFILES` in .env picks the active one, so a plain
  # `docker compose up -d` starts exactly one guard.
  #
  # Swapping is two steps — compose does NOT stop a container just because its
  # profile went inactive, and both bind the same port, so skipping the stop
  # fails with "port is already allocated":
  #
  #   docker compose stop prompt-guard
  #   COMPOSE_PROFILES=guard-ft docker compose up -d prompt-guard-ft
  #
  # and symmetrically to go back. Make it permanent by editing COMPOSE_PROFILES
  # in .env.
  #
  # The shared host port is deliberate: PROMPT_GUARD_BASE_URL never changes, so
  # the app cannot tell which build is behind it and no app config is touched
  # when you swap. It is also what enforces mutual exclusion. To run both side
  # by side for a comparison, set PROMPT_GUARD_FT_PORT to a free port (e.g.
  # 7999) and start prompt-guard-ft explicitly.
  #
  # prompt-guard-ft needs models/prompt_guard_id/ present — see models/README.md.
  # ---------------------------------------------------------------------------
  prompt-guard:
    profiles: ["guard-base"]
    build:
      context: ./services/prompt_guard
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMPT_GUARD_PORT:-7998}:7997"
    environment:
      PROMPT_GUARD_MODEL: ${INFINITY_PROMPT_GUARD_MODEL}
      PROMPT_GUARD_DEVICE: ${PROMPT_GUARD_DEVICE:-cpu}
      PROMPT_GUARD_MAX_LENGTH: ${PROMPT_GUARD_MAX_LENGTH:-512}
      HF_TOKEN: ${INFINITY_HF_API_KEY}
    volumes:
      - prompt_guard_cache:/cache/huggingface
      # Locally trained checkpoints, mounted read-only.
      - ./models:/models:ro

  # Indonesian fine-tune. Same image and same port as prompt-guard above — only
  # PROMPT_GUARD_MODEL differs — so this is a drop-in replacement, not a second
  # endpoint. Defaults to PROMPT_GUARD_PORT's value; override
  # PROMPT_GUARD_FT_PORT only when deliberately running both for comparison.
  prompt-guard-ft:
    profiles: ["guard-ft"]
    build:
      context: ./services/prompt_guard
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMPT_GUARD_FT_PORT:-7998}:7997"
    environment:
      # Defaults to the local training output. Point at a Hub id instead if the
      # checkpoint has been pushed.
      PROMPT_GUARD_MODEL: ${PROMPT_GUARD_FT_MODEL:-/models/prompt_guard_id}
      PROMPT_GUARD_DEVICE: ${PROMPT_GUARD_DEVICE:-cpu}
      PROMPT_GUARD_MAX_LENGTH: ${PROMPT_GUARD_MAX_LENGTH:-512}
      HF_TOKEN: ${INFINITY_HF_API_KEY}
    volumes:
      - prompt_guard_cache:/cache/huggingface
      - ./models:/models:ro

  unstructured-api:
    image: quay.io/unstructured-io/unstructured-api:0.1.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UNSTRUCTURED_PORT:-8001}:8000"
    environment:
      HF_TOKEN: ${UNSTRUCTURED_HF_TOKEN}

  # Only ONE NLI service is ever used: CHAT_NLI_MODEL_KIND selects the backend,
  # and the other two would be idle models holding memory for nothing. Each is
  # gated behind a profile matching its kind, so COMPOSE_PROFILES starts exactly
  # the one in use:
  #   CHAT_NLI_MODEL_KIND=indo_roberta -> COMPOSE_PROFILES=...,nli-indoroberta
  #   CHAT_NLI_MODEL_KIND=mmbert       -> COMPOSE_PROFILES=...,nli-mmbert
  #   CHAT_NLI_MODEL_KIND=zeroshot     -> COMPOSE_PROFILES=...,nli-zeroshot
  #
  # All three NLI services bind the SAME host port (`CHAT_NLI_PORT`, default 8002)
  # and app endpoint (`CHAT_NLI_BASE_URL`, default http://localhost:8002).
  # Swapping is two steps (stop previous container, then up new profile) without
  # needing to edit port numbers or app endpoint URLs.
  #
  # IndoRoBERTa NLI — the same model Infinity used to serve, moved onto the
  # in-house server so Infinity can be deleted. CPU by design (~500 MB): only
  # the reranker needs the GPU, and a second CUDA context would cost ~300-500 MB
  # of VRAM before loading a single weight.
  #
  # Selected by CHAT_NLI_MODEL_KIND=indo_roberta, routing to
  # CHAT_NLI_BASE_URL (http://localhost:8002). Note the *kind* still matters app-side
  # beyond routing: it picks the client (joined-text vs pair input), the label
  # space, and the token budget (indo-roberta caps at 512 positions, mmBERT at
  # 8192), so this is not interchangeable with the mmbert service by URL alone.
  nli-indoroberta:
    profiles: ["nli-indoroberta"]
    build:
      context: ./services/nli
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHAT_NLI_PORT:-8002}:7997"
    environment:
      NLI_MODEL: ${INFINITY_NLI_MODEL:-StevenLimcorn/indo-roberta-indonli}
      NLI_DEVICE: ${CHAT_NLI_DEVICE:-cpu}
      NLI_MAX_LENGTH: ${CHAT_NLI_MAX_LENGTH:-512}
      HF_TOKEN: ${INFINITY_HF_API_KEY}
    volumes:
      - nli_cache:/cache/huggingface
      - ./models:/models:ro

  # Zero-shot NLI baseline (binary entailment). The third CHAT_NLI_MODEL_KIND;
  # config referenced it long before a container existed, so selecting
  # `zeroshot` used to fail with connection refused. CPU, like the others.
  nli-zeroshot:
    profiles: ["nli-zeroshot"]
    build:
      context: ./services/nli
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHAT_NLI_PORT:-8002}:7997"
    environment:
      NLI_MODEL: ${CHAT_NLI_ZEROSHOT_MODEL:-MoritzLaurer/bge-m3-zeroshot-v2.0-c}
      NLI_DEVICE: ${CHAT_NLI_DEVICE:-cpu}
      NLI_MAX_LENGTH: ${CHAT_NLI_MAX_LENGTH:-512}
      HF_TOKEN: ${INFINITY_HF_API_KEY}
    volumes:
      - nli_cache:/cache/huggingface
      - ./models:/models:ro

  # NLI fine-tune (mmBERT-small on IndoNLI) on its own CPU server, separate
  # from Infinity because mmBERT is a ModernBERT architecture the pinned
  # Infinity image does not serve. Selected with CHAT_NLI_MODEL_KIND=mmbert —
  # **the default backend** (macro-F1 0.763 lay / 0.572 expert, against
  # indo-roberta's 0.727 / 0.554). Container name: skripsi-nli-1.
  nli:
    profiles: ["nli-mmbert"]
    build:
      context: ./services/nli
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHAT_NLI_PORT:-8002}:7997"
    environment:
      NLI_MODEL: ${CHAT_NLI_MMBERT_MODEL:-/models/mmbert_nli_id}
      NLI_DEVICE: ${CHAT_NLI_DEVICE:-cpu}
      NLI_MAX_LENGTH: ${CHAT_NLI_MAX_LENGTH:-512}
      HF_TOKEN: ${INFINITY_HF_API_KEY}
    volumes:
      - nli_cache:/cache/huggingface
      # Locally trained checkpoints, mounted read-only.
      - ./models:/models:ro

  # Local Qwen3Guard-Gen via Ollama (profile "qwen"). Hosted path is closed
  # (not on OpenRouter; HF Inference billing 402). CPU by default so it never
  # contends with reranker/NLI/embedder on the shared 8 GB GPU.
  #   docker compose --profile qwen up -d ollama
  #   docker exec ollama_backend ollama pull hf.co/geoffmunn/Qwen3Guard-Gen-0.6B:Q8_0
  ollama:
    image: ollama/ollama:0.24.0
    profiles: ["qwen"]
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_NUM_GPU: "0"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # deploy:  # uncomment to offload the 4B onto the GPU
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]


  # --- Observability (profile "monitoring") ---
  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOGGER_LOKI_PORT}:3100"
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    profiles: ["monitoring"]

  log_router:
    image: timberio/vector:0.47.0-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOGGER_VECTOR_PORT}:9000"
    volumes:
      - ./observability/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: --config /etc/vector/vector.yaml
    depends_on:
      - loki
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:12.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOGGER_GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${LOGGER_USERNAME:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${LOGGER_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - loki
    profiles: ["monitoring"]

# Volumes are plain, project-scoped declarations so this file is self-contained:
# `git clone && docker compose up -d` works on a fresh machine, creating empty
# volumes that ingestion then fills.
#
# They were previously declared `external: true` bound to `skripsi_*` names, to
# adopt an existing index without re-ingesting. That was unnecessary: the compose
# project is named `skripsi` (see `name:` at the top), so key `postgres_data`
# already resolves to `skripsi_postgres_data` — the same volume — and `docker
# volume inspect` confirms those volumes carry this project's own labels
# (com.docker.compose.project=skripsi). Dropping `external` therefore keeps every
# byte in place here while removing the clone-blocking dependency.
#
# Consequence to know: `docker compose down -v` will now delete these, which
# `external: true` used to prevent. Back up before running it.
volumes:
  postgres_data:
  ollama_data:
  qdrant_data:
  loki_data:
  grafana_data:
  infinity_cache:
  prompt_guard_cache:
  nli_cache:
  # TEI model weights (~2.3 GB for bge-reranker-v2-m3). Rebuildable cache —
  # a fresh clone just re-downloads.
  tei_cache:
  # HuggingFace cache for the app container (BGE-M3 embedder, ~2.3 GB). Same
  # deal: rebuildable, but keeping it makes rebuilds and restarts fast.
  hf_cache:
