<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ title | default('Skripsi App') }}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <!-- DOMPurify for sanitizing HTML output (XSS protection) -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js" integrity="sha384-nszIONF2FGC59kn+pPFaRa6WUNGwsZgXZiJxJwQbym+TzcH7smolUviLgpPbNx7V" crossorigin="anonymous"></script>
    <!-- Marked for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: '#2563eb',
              darkbg: '#212121',
              darksidebar: '#171717',
              darkborder: '#2f2f2f',
              darkinput: '#2f2f2f',
            },
          },
        },
      };
    </script>

  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-darkbg dark:text-gray-100 flex overflow-hidden h-screen text-[15px]">
    {% block layout %}{% endblock %}
  </body>
</html>
