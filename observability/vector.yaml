sources:
  docker_logs:
    type: "docker_logs"
    
  app_logs:
    type: "socket"
    address: "0.0.0.0:9000"
    mode: "tcp"
    decoding:
      codec: "json"

sinks:
  loki:
    type: "loki"
    inputs: ["docker_logs", "app_logs"]
    endpoint: "http://loki:3100"
    encoding:
      codec: "json"
    labels:
      container_name: "{{ container_name }}"
      image: "{{ image }}"
      source: "vector"
